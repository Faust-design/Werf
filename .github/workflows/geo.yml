name: Koordinaten
on:
  workflow_dispatch:
  push:
    paths: ["tools/geo2.py", "tools/todo.txt", ".github/workflows/geo.yml"]
permissions:
  contents: write
jobs:
  geo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: {shard: [0, 1, 2]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: timeout 45m python tools/geo2.py || true
        env: {SHARD: "${{ matrix.shard }}", SHARDS: "3"}
      - uses: actions/upload-artifact@v4
        with: {name: "geo2-${{ matrix.shard }}", path: "tools/geo2-${{ matrix.shard }}.json", if-no-files-found: ignore}
