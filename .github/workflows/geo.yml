name: Koordinaten
on:
  workflow_dispatch:
  push:
    paths: ["tools/geo2.py", "tools/todo.txt", ".github/workflows/geo.yml"]
permissions:
  contents: write
jobs:
  geo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: {shard: [0, 1, 2]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: timeout 35m python tools/geo2.py || true
        env: {SHARD: "${{ matrix.shard }}", SHARDS: "3"}
      - run: |
          git config user.name "werf-bot"
          git config user.email "werf-bot@users.noreply.github.com"
          git add tools/geo2-*.json || true
          git commit -m "Koordinaten, Teil ${{ matrix.shard }}" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((RANDOM % 10 + 5)); done
