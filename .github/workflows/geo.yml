name: Koordinaten
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  geo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: timeout 15m python tools/geo3.py || true
      - run: |
          git config user.name "werf-bot"
          git config user.email "werf-bot@users.noreply.github.com"
          git add tools/geo3.json || true
          git commit -m "Koordinaten, dritter Durchgang" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep 7; done
