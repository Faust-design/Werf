name: Koordinaten
on:
  workflow_dispatch:
  push:
    paths: ["tools/geo.py", "tools/geo2.py", "tools/todo.txt", ".github/workflows/geo.yml"]
permissions:
  contents: write
jobs:
  geo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python tools/geo2.py
      - run: |
          git config user.name "werf-bot"
          git config user.email "werf-bot@users.noreply.github.com"
          git add tools/geo2.json
          git commit -m "Koordinaten aus OpenStreetMap" || echo "nichts neu"
          git pull --rebase && git push
